projects_dir: projects_to_analyze
repos_file: repos.txt
cycles_file: cycles_to_analyze.txt
results_root: results
experiment_id: expF


llm:
  base_url: "http://172.17.0.1:11434/v1"
  api_key: "placeholder"
  model_raw: "qwen2.5-coder-32768:14b"
  context_length: 32768

openhands:
  runtime_image: "docker.openhands.dev/openhands/runtime:1.4-nikolaik"
  max_iters: 150
  commit_message: "Refactor: break dependency cycle"

atd_identification:
  exclude_dirs: []
  exclude_patterns: []
  strategy: balanced          # balanced | importance | bin
  size_bins: "2-3,4-5,6-8"   # used when strategy=bin
  max_per_repo: 0             # 0 = unlimited; used when strategy=bin

modes:
  - id: no_explain
    params:
      orchestrator: minimal

  - id: explain_E0_S0_noaux
    params:
      orchestrator: multi_agent
      edge_variant: E0
      synthesizer_variant: S0
      auxiliary_agent: none

  - id: explain_E1_S0_boundary
    params:
      orchestrator: multi_agent
      edge_variant: E1
      synthesizer_variant: S0
      auxiliary_agent: boundary

  - id: explain_E0_S2_project
    params:
      orchestrator: multi_agent
      edge_variant: E0
      synthesizer_variant: S2
      auxiliary_agent: project

