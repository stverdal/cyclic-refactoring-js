name: atd-v2

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:1.4
    container_name: openhands-app-v2
    ports: ["3001:3000"]
    environment:
      LLM_MODEL: "${LLM_MODEL}"
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LOG_ALL_EVENTS: "true"
      SANDBOX_RUNTIME_CONTAINER_IMAGE: "docker.openhands.dev/openhands/runtime:1.4-nikolaik"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE:-~}/.openhands:/.openhands
      - ./oh-work:/workspace   # shared folder you'll also mount in your ATD container
    extra_hosts:
      - "host.docker.internal:host-gateway"
